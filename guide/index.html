<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Expense Tracker</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        background: #f4f8ff;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
      }

      .hero {
        padding: 60px 0;
        text-align: center;
      }

      .hero h1 {
        font-size: 52px;
        color: #1e3a8a;
      }

      .hero p {
        margin-top: 15px;
        color: gray;
      }

      .main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #1d4ed8;
      }

      .expense {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        margin-top: 10px;
        background: #f8fafc;
        border-radius: 10px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }

      .box {
        padding: 15px;
        background: #eef4ff;
        border-radius: 12px;
        text-align: center;
      }

      canvas {
        width: 100%;
        margin-top: 20px;
      }

      @media (max-width: 800px) {
        .main {
          grid-template-columns: 1fr;
        }

        .hero h1 {
          font-size: 36px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <section class="hero">
        <h1>💰 Student Expense Tracker</h1>
        <p>Track expenses • Categorize spending • Visualize monthly insights</p>
      </section>

      <div class="main">
        <div class="card">
          <h2>Add Expense</h2>

          <input id="title" placeholder="Expense Name" />

          <input type="number" id="amount" placeholder="Amount" />

          <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Books</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>

          <input type="month" id="month" />

          <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="card">
          <h2>Monthly Summary</h2>

          <div class="summary">
            <div class="box">
              <h3 id="total">₹0</h3>
              <p>Total</p>
            </div>

            <div class="box">
              <h3 id="count">0</h3>
              <p>Expenses</p>
            </div>

            <div class="box">
              <h3 id="avg">₹0</h3>
              <p>Average</p>
            </div>
          </div>

          <canvas id="chart" width="400" height="300"> </canvas>
        </div>
      </div>

      <div class="card" style="margin-top: 30px">
        <h2>Expense History</h2>

        <div id="list"></div>
      </div>
    </div>

    <script>
      let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

      function save() {
        localStorage.setItem("expenses", JSON.stringify(expenses));
      }

      function addExpense() {
        let title = document.getElementById("title").value;

        let amount = +document.getElementById("amount").value;

        let category = document.getElementById("category").value;

        let month = document.getElementById("month").value;

        if (!title || !amount || !month) {
          alert("Fill all fields");
          return;
        }

        expenses.push({
          title,
          amount,
          category,
          month,
        });

        save();

        render();

        document.getElementById("title").value = "";
        document.getElementById("amount").value = "";
      }

      function render() {
        let list = document.getElementById("list");

        list.innerHTML = "";

        let total = 0;

        expenses.forEach((e, i) => {
          total += e.amount;

          list.innerHTML += `

<div class="expense">

<div>

<b>${e.title}</b>

<p>
${e.category}
</p>

</div>

<div>

₹${e.amount}

<br>

${e.month}

</div>

</div>

`;
        });

        document.getElementById("total").innerText = "₹" + total;

        document.getElementById("count").innerText = expenses.length;

        document.getElementById("avg").innerText =
          "₹" + (total / (expenses.length || 1)).toFixed(0);

        drawChart();
      }

      function drawChart() {
        let canvas = document.getElementById("chart");

        let ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, 400, 300);

        let data = {};

        expenses.forEach((e) => {
          data[e.category] = (data[e.category] || 0) + e.amount;
        });

        let values = Object.values(data);

        let keys = Object.keys(data);

        let sum = values.reduce((a, b) => a + b, 0);

        let colors = ["#2563eb", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];

        let start = 0;

        values.forEach((v, i) => {
          let angle = (v / sum) * Math.PI * 2;

          ctx.beginPath();

          ctx.moveTo(150, 150);

          ctx.arc(150, 150, 100, start, start + angle);

          ctx.fillStyle = colors[i];

          ctx.fill();

          start += angle;

          ctx.fillStyle = "#000";

          ctx.fillText(keys[i], 320, 50 + i * 30);
        });
      }

      render();
    </script>
  </body>
</html>
