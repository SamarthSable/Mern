<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            display: inline-block;
        }
        .menu{
            display: block;
        }
        .dot{
            border-radius: 50%;
            background-color: #424242 ;
            height: 1rem;
            width: 1rem;
            margin-bottom: 4px;
        }
        .square{
            background-color: #424242 ;
            height: 1rem;
            width: 1rem;
            margin-bottom: 4px;
        }
        .rect{
            background-color: #424242 ;
            height: 0.5rem;
            width: 2.5rem;
            margin: 4px;
        }
        .menu:hover{
            .dot, .square,.rect{
            background-color: rgba(68, 240, 76, 0.4) ;
            cursor: pointer;
            }

        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>
</head>
<body>
    <div class="menu"> 
     <div class="dot"><br /></div> 
     <div class="dot"><br /></div> 
     <div class="dot"><br /></div> 
   </div> 
   <div class="menu"> 
     <div class="square"><br /></div> 
     <div class="square"><br /></div> 
     <div class="square"><br /></div> 
   </div> 
   <div class="menu"> 
     <div class="rect"><br /></div> 
     <div class="rect"><br /></div> 
     <div class="rect"><br /></div> 
   </div> 
    
</body>
</html>
